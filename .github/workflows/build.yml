name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix structure and install Gradle
        run: |
          mv .github/workflows/build.gradle . 2>/dev/null || true
          mv .github/workflows/settings.gradle . 2>/dev/null || true
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          export PATH=$PWD/gradle-8.4/bin:$PATH
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BlackxitFF
          path: app/build/outputs/apk/debug/*.apk
