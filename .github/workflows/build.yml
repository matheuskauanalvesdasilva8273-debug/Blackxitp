name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Move files to root
        run: |
          mv .github/workflows/build.gradle . 2>/dev/null || true
          mv .github/workflows/settings.gradle . 2>/dev/null || true
          mv .github/workflows/gradlew . 2>/dev/null || true
          chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BlackxitFF
          path: "**/*.apk"
