name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Fix structure
        run: |
          cp .github/workflows/build.gradle . 2>/dev/null || true
          cp .github/workflows/settings.gradle . 2>/dev/null || true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: gradle assembleDebug --stacktrace 2>&1 | tail -50
      - uses: actions/upload-artifact@v4
        with:
          name: BlackxitFF
          path: app/build/outputs/apk/debug/*.apk
